name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install distribution and check dependencies
        run: |
          python -m pip install .
          python -m pip check
      - name: Test installed dashboard and packaged assets
        run: python -m unittest discover -s tests -p test_dashboard.py -v
      # The study recorder freezes repository-only tools/paper/evaluate_frozen.py.
      # Its tests require the complete checkout, as documented in the handoff.
      - name: Install checkout for study and analysis tests
        run: python -m pip install --editable .
      - name: Test complete checkout
        shell: python
        run: |
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover("tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          # Keep failure details visible in checks even when archived logs
          # cannot be downloaded from GitHub's external storage endpoint.
          for test, detail in result.errors + result.failures:
              message = (str(test) + "\n" + detail).replace("%", "%25")
              message = message.replace("\r", "%0D").replace("\n", "%0A")
              print("::error title=Unit test failure::" + message)
          sys.exit(0 if result.wasSuccessful() else 1)
